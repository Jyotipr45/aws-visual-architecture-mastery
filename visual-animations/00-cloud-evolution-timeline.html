  footer{font-size:13px;color:var(--dim);text-align:center;margin-top:6px}

  /* SVG styling */
  .era{opacity:0;pointer-events:none;transition:opacity .5s ease}
  .era.on{opacity:1;pointer-events:auto}
  .t1{font-size:14px;font-weight:700;fill:var(--text)}
  .t2{font-size:12px;fill:var(--muted)}
  .t3{font-size:11px;fill:var(--dim);font-family:ui-monospace,Consolas,monospace}

  .wire{fill:none;stroke:rgba(148,163,184,.25);stroke-width:2}
  .wire.dash{stroke-dasharray:5 5}
  .pkt{fill:none;stroke:var(--c);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:5 200;stroke-dashoffset:5;
    filter:drop-shadow(0 0 4px var(--c));
    animation:pkt calc(var(--dur,2.4s) / var(--speed)) linear infinite;animation-delay:calc(var(--delay,0s) / var(--speed))}
  .pkt.seg{animation-name:pktSeg}
  @keyframes pkt{from{stroke-dashoffset:5}to{stroke-dashoffset:-100}}
  @keyframes pktSeg{0%{stroke-dashoffset:5}20%,100%{stroke-dashoffset:-100}}
  .anim{animation-duration:calc(var(--dur,4s) / var(--speed));animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  .rush{animation-name:rush;--dur:7s}
  @keyframes rush{0%,30%{opacity:.18}42%,78%{opacity:1}90%,100%{opacity:.18}}
  .glow{animation-name:glow;--dur:4s}
  @keyframes glow{0%,38%{opacity:0}44%,70%{opacity:.38}78%,100%{opacity:0}}
  .meter{transform-box:fill-box;transform-origin:left center;animation-name:meter;--dur:4s;animation-timing-function:linear}
  @keyframes meter{0%,40%{transform:scaleX(0)}75%,95%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  .fan{transform-box:fill-box;transform-origin:center;animation:spin calc(1.2s / var(--speed)) linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .paused .pkt,.paused .anim,.paused .fan{animation-play-state:paused}

  @media (max-width:1100px){.main{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:640px){.app{padding:18px 14px 40px}.step .nm{font-size:11px}.dot{width:34px;height:34px;font-size:15px}.track{top:34px}.auto{display:none}}
  @media (prefers-reduced-motion:reduce){.pkt,.anim,.fan{animation:none}.pkt{stroke-dasharray:none;opacity:.6}}
</style>

/* =====================================================================
   SVG BUILDERS: fixed grid, generous margins, nothing clipped.
   viewBox 0 0 1000 520 · content kept inside x 40..960, y 30..505
   ===================================================================== */
const col = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function node({id,x,y,w,h,title,sub,sub2,c,cls=""}){
  const cx=x+w/2, lines=[title,sub,sub2].filter(Boolean).length;
  const top=y+h/2-(lines-1)*9+5;
  return `<g class="node ${cls}" data-info="${id}" tabindex="0" role="button" aria-label="${esc(INFO[id].name)}" style="--hc:${c}">
    <rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${c}14" stroke="${c}" stroke-width="1.5"/>
    <text x="${cx}" y="${top}" text-anchor="middle" class="t1">${esc(title)}</text>
    ${sub?`<text x="${cx}" y="${top+18}" text-anchor="middle" class="t2">${esc(sub)}</text>`:""}
    ${sub2?`<text x="${cx}" y="${top+35}" text-anchor="middle" class="t3">${esc(sub2)}</text>`:""}
  </g>`;
}
function zone({id,x,y,w,h,label,c}){
  return `<g class="node" data-info="${id}" tabindex="0" role="button" aria-label="${esc(INFO[id].name)}" style="--hc:${c}">
    <rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="${c}08" stroke="${c}" stroke-opacity=".55" stroke-dasharray="7 6" stroke-width="1.5"/>
    <text x="${x+18}" y="${y+26}" class="zl" fill="${c}">${esc(label)}</text>
  </g>`;
}
function badge({id,x,text,c}){
  return `<g class="node" data-info="${id}" tabindex="0" role="button" aria-label="${esc(INFO[id].name)}" style="--hc:${c}">
    <rect class="box" x="${x}" y="462" width="216" height="40" rx="20" fill="#0f172a" stroke="${c}" stroke-opacity=".6"/>
    <text x="${x+108}" y="487" text-anchor="middle" class="t2" style="fill:#e2e8f0">${esc(text)}</text>
  </g>`;
}
const flow = (d,c,o={}) => `<path class="wire ${o.dash?'dash':''}" d="${d}" ${o.arrow?'marker-end="url(#arrow)"':''}/>` +
  (o.nopkt?``:`<path class="pkt ${o.seg?'seg':''}" pathLength="100" d="${d}" style="--c:${c};--delay:${o.delay||0}s;--dur:${o.dur||2.4}s"/>`);
const bar = (x,y,w,pct,c,label) => `<text x="${x}" y="${y-6}" class="t3">${label}</text>
  <rect x="${x}" y="${y}" width="${w}" height="8" rx="4" fill="rgba(148,163,184,.15)"/>
  <rect x="${x}" y="${y}" width="${w*pct/100}" height="8" rx="4" fill="${c}"/>`;

/* =====================================================================
   UI STATE + CONTROLS
   ===================================================================== */
let cur=0, playing=true, auto=false, speed=1, elapsed=0, pinned=null;
const AUTO_MS=12000;
const $=id=>document.getElementById(id);

function buildTimeline(){
  const tl=$("timeline");
  ERAS.forEach((e,i)=>{
    const b=document.createElement("button");
    b.className="step"; b.style.setProperty("--c",`var(${e.c})`);
    b.innerHTML=`<span class="dot">${e.icon}</span><span class="yr">${e.yr}</span><span class="nm">${e.nm}</span>`;
    b.setAttribute("aria-label",`Era ${i+1}: ${e.nm}`);
    b.onclick=()=>go(i);
    tl.appendChild(b);
  });
}

function go(i){
  cur=(i+ERAS.length)%ERAS.length; elapsed=0; pinned=null;
  const e=ERAS[cur];
  document.documentElement.style.setProperty("--accent",`var(${e.c})`);
  document.querySelectorAll(".era").forEach(g=>g.classList.toggle("on",+g.dataset.era===cur));
  document.querySelectorAll(".step").forEach((s,k)=>{s.classList.toggle("on",k===cur);s.classList.toggle("done",k<cur)});
  $("trackFill").style.width=(cur/(ERAS.length-1)*100)+"%";
  $("hEra").textContent=e.nm;
  $("counter").textContent=`${cur+1} / ${ERAS.length}`;
  $("story").innerHTML=`<h2>The story</h2><h3>${e.title}</h3><div class="when">${e.when}</div>
    <p>${e.story}</p><p><span class="tag pain">Pain</span>${e.pain}</p><p><span class="tag fix">Fix</span>${e.fix}</p>
    <div class="born">AWS services born from this: ${e.born}</div>`;
  $("stats").innerHTML=e.stats.map(([k,v])=>`<div class="glass stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  document.querySelectorAll(".node.sel").forEach(n=>n.classList.remove("sel"));
  showInfo(null);
}

function showInfo(id,pin){
  const box=$("insp");
  if(!id){box.innerHTML=`<h2>Inspector</h2><p class="empty">Hover over or click any box, badge or bar in the diagram to see what it is, its nickname, why it exists and what it connects to.</p>`;return}
  const d=INFO[id];
  box.innerHTML=`<h2>Inspector ${pin?'<span class="pin">📌 pinned · click empty space to unpin</span>':''}</h2>
    <h3>${d.name}</h3><div class="alias">aka ${d.alias}</div>
    <dl><dt>What it is</dt><dd>${d.what}</dd><dt>Why it exists</dt><dd>${d.why}</dd>
    <dt>How it connects</dt><dd>${d.connects}</dd><dt>Details</dt><dd class="tech">${d.tech}</dd></dl>`;
}

function wireInspector(){
  const svg=$("svg");
  svg.addEventListener("mouseover",e=>{const n=e.target.closest(".node"); if(n&&!pinned) showInfo(n.dataset.info)});
  svg.addEventListener("mouseleave",()=>{ if(!pinned) showInfo(null)});
  svg.addEventListener("click",e=>{
    const n=e.target.closest(".node");
    document.querySelectorAll(".node.sel").forEach(x=>x.classList.remove("sel"));
    if(!n){pinned=null;showInfo(null);return}
    pinned=n.dataset.info; n.classList.add("sel"); showInfo(pinned,true);
  });
  svg.addEventListener("keydown",e=>{
    const n=e.target.closest(".node");
    if(n&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.stopPropagation();n.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
  });
  svg.addEventListener("focusin",e=>{const n=e.target.closest(".node"); if(n&&!pinned) showInfo(n.dataset.info)});
}

function setPlaying(p){
  playing=p; $("app").classList.toggle("paused",!p);
  $("play").textContent=p?"⏸ Pause":"▶ Play";
}

function wireControls(){
  $("prev").onclick=()=>go(cur-1);
  $("next").onclick=()=>go(cur+1);
  $("play").onclick=()=>setPlaying(!playing);
  $("speed").onchange=e=>{speed=+e.target.value;document.documentElement.style.setProperty("--speed",speed)};
  $("autoAdv").onchange=e=>{auto=e.target.checked;elapsed=0};
  document.addEventListener("keydown",e=>{
    if(e.target.closest("select,input,.node")) return;
    if(e.key==="ArrowRight") go(cur+1);
    else if(e.key==="ArrowLeft") go(cur-1);
    else if(e.key===" "){e.preventDefault();setPlaying(!playing)}
  });
  let last=performance.now();
  (function tick(now){
    const dt=now-last; last=now;
    if(playing&&auto){elapsed+=dt*speed; if(elapsed>=AUTO_MS) go(cur+1)}
    $("autoBar").style.width=(auto?Math.min(elapsed/AUTO_MS,1)*100:0)+"%";
    requestAnimationFrame(tick);
  })(last);
}

buildEras(); buildTimeline(); wireInspector(); wireControls(); go(0); setPlaying(true);
</script>
